# FrostByte configuration
# All sections are optional - sane defaults apply.

[fans]
# Fan mode: auto | manual | max | curve
mode = auto
# Fixed speeds used by manual mode (percent, 0 = firmware auto)
manual_cpu = 50
manual_gpu = 50

[curves]
# temp:speed pairs, ascending. Linear interpolation between points.
cpu = 40:20,55:30,65:45,75:65,85:85,93:100
gpu = 40:20,55:35,65:55,75:75,85:100

[profiles]
# Thermal profile remembered per power source
ac = performance
battery = balanced
follow_power_source = true

[hotkey]
# Keycodes that toggle the FrostByte GUI (the NitroSense "N" key).
# 425 = kernel default for scancode 0xf5; 148 = KEY_PROG1 (hwdb remap).
# Discover yours with: sudo frostbyte-keyd --learn
keycodes = 425,148
enabled = true
