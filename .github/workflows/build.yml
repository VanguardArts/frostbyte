name: build

# Build native packages on tag push (or manual run) and attach them to the
# release: .deb (Ubuntu), .rpm (Fedora), .pkg.tar.zst (Arch) + source tarball.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: |
          ./packaging/build-deb.sh
          ls -la dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: frostbyte-deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM in Fedora container
        run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frostbyte-rpm
          path: dist/*.rpm

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch package in Arch container
        run: ./packaging/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frostbyte-arch
          path: dist/*.pkg.tar.*

  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source tarball
        run: make tarball
      - uses: actions/upload-artifact@v4
        with:
          name: frostbyte-tarball
          path: dist/*.tar.gz

  release:
    needs: [deb, rpm, arch, tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
